{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Public Holidays</h1>
<form method="post" action="/holidays/add" class="bg-white p-4 rounded shadow mb-4 flex gap-2 items-end">
  <div><label class="block text-sm">Date</label><input name="d" type="date" class="border rounded px-2 py-1" required></div>
  <div><label class="block text-sm">Name</label><input name="name" class="border rounded px-2 py-1" required></div>
  <button class="bg-indigo-600 text-white px-4 py-2 rounded">Add</button>
</form>
<table class="w-full bg-white rounded shadow text-sm">
  <thead><tr class="bg-gray-100"><th class="p-2 text-left">Date</th><th class="p-2 text-left">Name</th></tr></thead>
  <tbody>
  {% for h in holidays %}
    <tr class="border-t"><td class="p-2">{{h.date}}</td><td class="p-2">{{h.name}}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
