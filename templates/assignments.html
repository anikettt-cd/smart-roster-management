{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Assignments</h1>
<form method="post" action="/assignments/add" class="bg-white p-4 rounded shadow mb-4 flex gap-2 items-end flex-wrap">
  <div><label class="block text-sm">Employee</label>
    <select name="employee_id" class="border rounded px-2 py-1">{% for e in employees %}<option value="{{e.id}}">{{e.name}}</option>{% endfor %}</select></div>
  <div><label class="block text-sm">Brand</label>
    <select name="brand_id" class="border rounded px-2 py-1">{% for b in brands %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></div>
  <div><label class="block text-sm">Process</label>
    <select name="process_id" class="border rounded px-2 py-1">{% for p in processes %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></div>
  <button class="bg-indigo-600 text-white px-4 py-2 rounded">Add</button>
</form>
<table class="w-full bg-white rounded shadow text-sm">
  <thead><tr class="bg-gray-100"><th class="p-2 text-left">Employee</th><th class="p-2 text-left">Brand</th><th class="p-2 text-left">Process</th></tr></thead>
  <tbody>
  {% for a in assigns %}
    <tr class="border-t"><td class="p-2">{{a.employee.name}}</td><td class="p-2">{{a.brand.name}}</td><td class="p-2">{{a.process.name}}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
