{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Leaves & Unavailability</h1>
<form method="post" action="/leaves/add" class="bg-white p-4 rounded shadow mb-4 flex gap-2 items-end flex-wrap">
  <div><label class="block text-sm">Employee</label>
    <select name="employee_id" class="border rounded px-2 py-1">{% for e in employees %}<option value="{{e.id}}">{{e.name}}</option>{% endfor %}</select></div>
  <div><label class="block text-sm">Date</label><input name="d" type="date" class="border rounded px-2 py-1" required></div>
  <div><label class="block text-sm">Type</label>
    <select name="leave_type" class="border rounded px-2 py-1"><option value="leave">leave</option><option value="comp_off">comp_off</option><option value="unavailable">unavailable</option></select></div>
  <div><label class="block text-sm">Reason</label><input name="reason" class="border rounded px-2 py-1"></div>
  <button class="bg-indigo-600 text-white px-4 py-2 rounded">Add</button>
</form>
<table class="w-full bg-white rounded shadow text-sm">
  <thead><tr class="bg-gray-100"><th class="p-2 text-left">Employee</th><th class="p-2 text-left">Date</th><th class="p-2 text-left">Type</th><th class="p-2 text-left">Status</th><th class="p-2 text-left">Reason</th></tr></thead>
  <tbody>
  {% for l in leaves %}
    <tr class="border-t"><td class="p-2">{{l.employee.name}}</td><td class="p-2">{{l.date}}</td><td class="p-2">{{l.leave_type}}</td><td class="p-2">{{l.status}}</td><td class="p-2">{{l.reason}}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
