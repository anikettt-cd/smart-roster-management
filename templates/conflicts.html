{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Conflicts - Roster {{roster.year}}-{{roster.month}}</h1>
<a href="/roster/{{roster.id}}" class="text-indigo-600 hover:underline mb-3 inline-block">Back to roster</a>
<table class="w-full bg-white rounded shadow text-sm">
  <thead><tr class="bg-gray-100"><th class="p-2 text-left">Severity</th><th class="p-2 text-left">Type</th><th class="p-2 text-left">Message</th></tr></thead>
  <tbody>
  {% for c in conflicts %}
    <tr class="border-t">
      <td class="p-2 {% if c.severity=='high' %}text-red-600 font-bold{% else %}text-orange-600{% endif %}">{{c.severity}}</td>
      <td class="p-2">{{c.type}}</td>
      <td class="p-2">{{c.message}}</td>
    </tr>
  {% else %}
    <tr><td colspan="3" class="p-4 text-center text-green-600">No conflicts detected.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
